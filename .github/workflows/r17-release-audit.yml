name: R17 public release audit

on:
  push:
    branches: [codex/r17-release-smoke]

permissions:
  contents: read

jobs:
  audit:
    name: R17 public assets on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download, install, prove and render
        run: python .github/r17_release_audit.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r17-release-audit-${{ matrix.os }}
          path: r17-audit/evidence/
